[workspace]
name = "My Vault"
template = "blank"

[search]
engine = "sqlite"

[search.vector]
enabled = true
worker_count = 2

[search.vector.embedder]
type = "onnx"
model_path = "/data/.kiwi/models/multilingual-e5-small/onnx/model.onnx"
tokenizer_path = "/data/.kiwi/models/multilingual-e5-small/tokenizer.json"
dimensions = 384
query_prefix = "query: "
passage_prefix = "passage: "

[search.vector.store]
provider = "sqlite-vec"

[versioning]
strategy = "git"

[janitor]
stale_days = 90
check_orphans = true
check_broken_links = true

[memory]
episodes_path_prefix = "raw/"
