[workspace]
name = "My Vault"
template = "blank"

[search]
engine = "sqlite"

[search.vector]
enabled = false
# To enable: set enabled = true and build KiwiFS with -tags onnx,
# or configure an Ollama/OpenAI-compatible endpoint.
# See https://docs.kiwifs.com/configuration#vector-search

[versioning]
strategy = "git"

[janitor]
stale_days = 90
check_orphans = true
check_broken_links = true

[memory]
episodes_path_prefix = "raw/"
