[server]
port = 3333
host = "0.0.0.0"

[storage]
root = "/data"

[search]
engine = "sqlite"

[search.vector]
enabled = true
worker_count = 2

[search.vector.embedder]
provider = "onnx"
model_path = "~/.kiwi/models/multilingual-e5-small/onnx/model.onnx"
dimensions = 384
query_prefix = "query: "
passage_prefix = "passage: "

[search.vector.store]
provider = "sqlite-vec"

[versioning]
strategy = "git"

[backup]
remote = ""
interval = "10m"
branch = "main"
rebase_before_push = true
