# Template — Mercury Configuration
#
# Copy this file to ~/.mercury/mercury.yaml and fill in your values.
# Environment variables (.env) are also supported for API keys.

identity:
  name: mercury
  owner: ""  # Your name (set during setup)

providers:
  openai:
    name: openai
    apiKey: "${OPENAI_API_KEY}"
    baseUrl: ""      # e.g. https://api.openai.com/v1
    model: ""        # e.g. gpt-4o-mini, deepseek-v4-flash-free
    enabled: true

channels:
  telegram:
    enabled: true
    botToken: "${TELEGRAM_TOKEN}"

web:
  enabled: true
  port: 6174

permissions:
  mode: allow-all

skills:
  auto_discover: true

memory:
  enabled: true
