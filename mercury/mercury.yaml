# Template — Mercury Configuration
#
# Copy this file to ~/.mercury/mercury.yaml and fill in your values.
# Environment variables (.env) are also supported for API keys.
#
# Used for the octarine-notes vault: OpenKB (server) + OpenKnowledge (desktop).
# Provider here is MiniMax (used by Mercury and the OpenKB compile pipeline).

identity:
  name: mercury
  owner: ""  # Your name (set during setup)

providers:
  openai:
    name: openai
    apiKey: "${OPENAI_API_KEY}"
    baseUrl: "https://api.minimax.io/v1"   # MiniMax OpenAI-compatible endpoint
    model: "MiniMax-M3"                    # or e.g. gpt-4o-mini, deepseek-v4-flash-free
    enabled: true

channels:
  telegram:
    enabled: true
    botToken: "${TELEGRAM_TOKEN}"

web:
  enabled: true
  port: 6174

permissions:
  mode: allow-all

skills:
  auto_discover: true

memory:
  enabled: true